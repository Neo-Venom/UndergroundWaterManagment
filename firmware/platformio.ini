; ============================================================================
; PlatformIO Project Configuration for Underground Water Management System
; InnovateX: Techfest, IIT Bombay
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = UnderGroundWaterManagement_Main

[env:esp32dev]
platform = espressif32 @ ~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler flags for performance & memory optimization
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS=1

; Required third-party libraries (auto-downloaded by PlatformIO)
lib_deps =
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; Partition table configuration for SPIFFS / Large firmware
board_build.partitions = default.csv
